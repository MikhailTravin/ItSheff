<!DOCTYPE html>
<html lang="ru">

	<head>
		<title>Загрузчик - yведомления ошибка</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">



		<link rel="stylesheet" href="css/styles.css" />

		<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	</head>

	<body class="preload mp loader-page">
		<div class="main-wrapper-outer">
			<header class="header-loader">
				<div class="header-loader__content">
					<a href="./" class="header-loader__logo">
						<svg aria-hidden="true" width="120" height="26">
							<use xlink:href="img/sprite.svg#logo1"></use>
						</svg>
					</a>
					<div class="header-loader__right">
						<a href="./" class="header-loader-chat">
							<div class="header-loader-chat__icon">
								<svg aria-hidden="true" width="20" height="21">
									<use xlink:href="img/sprite.svg#chat2"></use>
								</svg>
							</div>
							<span>Спросить онлайн</span>
						</a>
						<div class="header-notifications">
							<div class="header-notifications__icon">
								<div class="header-notifications__image">
									<svg aria-hidden="true" width="20" height="22" class="icon1">
										<use xlink:href="img/sprite.svg#notification2"></use>
									</svg>
								</div>
							</div>
							<div class="header-notifications__dropdown header-dropdown">
								<div class="header-notifications__top">
									<div class="breadcrumbs2">
										<ul>
											<li>
												<a href="./">Уведомления</a>
											</li>
											<li><span>Ошибка авторизации</span></li>
										</ul>
									</div>
									<button type="button" class="header-notifications__close">
										<svg aria-hidden="true" width="14" height="14">
											<use xlink:href="img/sprite.svg#close"></use>
										</svg>
									</button>
								</div>
								<div class="header-notifications-error">
									<div data-simplebar class="header-notifications-error__simplebar">
										<div class="header-notifications-error__body">
											<div class="header-notifications-error__top">
												<div class="header-notifications-error__icon">
													<img src="img/icons/icons-orange/warning.svg" alt="">
												</div>
												<div class="header-notifications-error__ttile">
													Ошибка
												</div>
											</div>
											<p>
												Вы были отключены за неуплату.<br> Оплатите счета
											</p>
										</div>
									</div>
									<div class="header-notifications-buttons">
										<a href="./" class="btn btn-big">Оплатить</a>
										<button type="button" href="./" class="btn btn-bg btn-big btn-close">Назад</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</header>
			<main class="main">

			</main>
		</div>



		<script src="js/vendor/simplebar.min.js"></script>

		<script src="js/vendor/nouislider.min.js"></script>

		<script src="js/core/helpers.js"></script>

		<script src="js/core/shared-refs.js"></script>

		<script src="js/core/menu.js"></script>

		<script src="js/core/scroll-to.js"></script>

		<script src="js/forms/form-validate.js"></script>

		<script src="js/popups/popup.js"></script>

		<script src="js/components/more-buttons.js"></script>

		<script src="js/components/form-quantity.js"></script>

		<script src="js/components/card-subscriptions.js"></script>

		<script src="js/components/loader-databases.js"></script>

		<script src="js/components/tabs.js"></script>

		<script src="js/forms/form-fields.js"></script>

		<script src="js/forms/form-submit.js"></script>

		<script src="js/forms/search.js"></script>

		<script src="js/forms/form-rating.js"></script>

		<script src="js/forms/file-uploaders.js"></script>

		<script src="js/popups/popup-base-observer.js"></script>

		<script src="js/components/tooltips.js"></script>

		<script src="js/components/show-more.js"></script>

		<script src="js/components/applications-cards.js"></script>

		<script src="js/components/applications-columns.js"></script>

		<script src="js/components/draggable.js"></script>

		<script src="js/forms/form-textareas.js"></script>

		<script src="js/popups/popup-systems.js"></script>

		<script src="js/components/breadcrumbs.js"></script>

		<script src="js/components/fixed-bottom-spacing.js"></script>

		<script src="js/loader/quiz.js"></script>

		<script src="js/loader/notifications.js"></script>


	</body>

</html>
